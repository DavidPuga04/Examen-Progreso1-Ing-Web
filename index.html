<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foodzy - Shop</title>

  <link rel="stylesheet" href="css/Styles.css">
</head>

<body>

  <!-- TOPBAR -->
  <header class="topbar">
    <div class="topbar__container">

      <!-- MENÚ -->
      <div class="topbar__menu-btn">
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </div>

      <!-- NAV -->
      <nav class="topbar__nav" aria-label="Menú principal">
        <ul class="topbar__menu">
          <li>Home</li>

          <li>
            Category
            <img src="assets/icons/iconoflecha.svg" alt="Account" class="icon">
          </li>

          <li>
            Products
           <img src="assets/icons/iconoflecha.svg" alt="Account" class="icon">
          </li>

          <li>
            Pages
           <img src="assets/icons/iconoflecha.svg" alt="Account" class="icon">
          </li>

          <li>
            Blog
            <img src="assets/icons/iconoflecha.svg" alt="Account" class="icon">
          </li>

          <li>
            Elements
            <img src="assets/icons/iconoflecha.svg" alt="Account" class="icon">
          </li>
        </ul>
      </nav>

      <!-- TELÉFONO -->
      <div class="topbar__contact"> 
        <img src="assets/icons/telefonosinfondoarribaderecha.svg" alt="Account" class="icon">
        <span>+123 (456) (7890)</span>
      </div>

    </div>
  </header>

  <!-- HEADER PRINCIPAL -->
  <header class="header">
    <div class="header__container">

      <div class="header__logo">
        <img src="assets/img/logo_arriba.png" alt="Foodzy">
        <div>
          <h1>Foodzy</h1>
          <span>A Treasure of Tastes</span>
        </div>
      </div>

      <!-- SEARCH -->
      <div class="header__search">
        <input type="text" placeholder="Search For Items...">
        <select>
          <option>All Categories</option>
        </select>

        <button aria-label="Buscar">
        <img src="assets/icons/iconolupa.svg" alt="Account" class="icon">
        </button>
      </div>

      <!-- ACTIONS -->
      <div class="header__actions">

       <span class="header__action">
             <img src="assets/icons/iconoaccount.svg" alt="Account" class="icon">
            Account
       </span>

        <span class="header__action">
          <img src="assets/icons/iconowishlist.svg" alt="Account" class="icon">
          Wishlist
        </span>

        <span class="header__action">
         <img src="assets/icons/iconocart.svg" alt="Account" class="icon">
          Cart
        </span>

      </div>

    </div>
  </header>

  <!-- CONTENIDO -->
  <main>
    <section class="banner">
      <div class="banner__container">
        <h2>Shop</h2>
        <span>Home - Shop</span>
      </div>
    </section>
  </main>

</body>
</html>
